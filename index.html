<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>举爪🐾 | 治愈系萌宠答案之书</title>
    <style>
        body { background: #fffaf0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: "Microsoft YaHei"; }
        #app { text-align: center; }
        .logo-img { width: 200px; height: auto; margin-bottom: 10px; }
        p { color: #8a7d6a; font-size: 1.1rem; margin-top: 0; }
        .input-group { margin-top: 30px; }
        input { padding: 15px; border-radius: 25px; border: 3px solid #ffb6c1; width: 140px; text-align: center; font-size: 20px; outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); }
        button { background: #ffb6c1; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 20px; margin-top: 20px; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(255,182,193,0.4); }
        button:hover { background: #ff99aa; transform: translateY(-3px); }
        #mask { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 90; backdrop-filter: blur(3px); }
        #paper { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border: 5px dashed #ffb6c1; border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.3); width: 340px; text-align: center; z-index: 100; }
        #answer-text { font-size: 24px; color: #333; font-weight: bold; margin: 25px 0; line-height: 1.6; }
        .pet-img { width: 220px; height: 220px; object-fit: cover; border-radius: 15px; border: 3px solid #fff5f5; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .close-btn { background: #ffb6c1; font-size: 14px; padding: 10px 20px; color: white; border: none; border-radius: 20px; cursor: pointer; }
        .cancel-btn { background: #ccc; font-size: 14px; padding: 10px 20px; color: white; border: none; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <img src="assets/logo.png" alt="举爪Logo" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/616/616408.png'">
    <p>闭上双眼默念你的问题，然后输入 1-412 其中的数字。</p>
    <div class="input-group">
        <input type="number" id="userNum" placeholder="输入编号" min="1" max="412" onkeydown="handleEnter(event)">
        <br>
        <button onclick="revealAnswer()">投喂小鱼干，猫猫回答</button>
    </div>
</div>

<div id="mask" onclick="closePaper()"></div>

<div id="paper">
    <img id="result-pet" class="pet-img" src="" alt="萌宠图片">
    <div id="answer-text">正在翻阅答案之书...</div>
    <div class="btn-group">
        <button class="cancel-btn" onclick="closePaper()">这个不算数哦</button>
        <button class="close-btn" onclick="closePaper()">谢谢猫猫大人</button>
    </div>
</div>

<script src="answers.js"></script>

<script>
    // --- 新增：回车键监听函数 ---
    function handleEnter(event) {
        // 如果按下的键是 Enter (回车键)
        if (event.key === "Enter") {
            revealAnswer(); // 直接调用显示答案的函数
        }
    }

    function revealAnswer() {
        const num = document.getElementById('userNum').value;
        if(!num || num < 1 || num > 412) {
            alert("喵呜？请输入 1 到 412 之间的数字哦！");
            return;
        }

        const answer = ANSWERS_DATA[num];
        if(!answer) {
            alert("这个页码的答案好像被猫叼走了，换一个试试？");
            return;
        }

        let folder = "";
        let minImg = 1, maxImg = 1;

        if (num >= 1 && num <= 67) {
            folder = "happy"; minImg = 1; maxImg = 67;
        } else if (num >= 68 && num <= 105) {
            folder = "neutral"; minImg = 68; maxImg = 105;
        } else {
            folder = "sad"; minImg = 106; maxImg = 150;
        }

        const randomImgId = Math.floor(Math.random() * (maxImg - minImg + 1)) + minImg;
        const imgPath = 'assets/' + folder + '/' + randomImgId + '.PNG?t=' + new Date().getTime();
        const petImgElement = document.getElementById('result-pet');
        
        petImgElement.src = imgPath;
        document.getElementById('answer-text').innerText = answer;

        petImgElement.onerror = function() {
            this.src = "https://cdn-icons-png.flaticon.com/512/616/616408.PNG";
        };

        document.getElementById('mask').style.display = 'block';
        document.getElementById('paper').style.display = 'block';
    }

    function closePaper() {
        document.getElementById('mask').style.display = 'none';
        document.getElementById('paper').style.display = 'none';
        document.getElementById('userNum').value = ''; 
    }
</script>

</body>
</html>
