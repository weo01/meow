<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>举爪 🐾 | 治愈系萌宠答案之书</title>
    <style>
        body { 
            background: #fffaf0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
        }
        #app { text-align: center; margin-top: 50px; }
        .logo-img { width: 180px; height: auto; margin-bottom: 10px; }
        p { color: #8a7d6a; font-size: 1.1rem; margin-top: 0; }
        
        /* 输入框和按钮 */
        .input-group { margin-top: 30px; }
        input { 
            padding: 15px; border-radius: 25px; border: 3px solid #ffb6c1; 
            outline: none; width: 200px; text-align: center; font-size: 1rem;
        }
        button { 
            background: #ffb6c1; color: white; border: none; padding: 12px 30px; 
            border-radius: 25px; cursor: pointer; font-size: 1.1rem; margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { background: #ff99aa; transform: translateY(-3px); }

        /* 弹窗遮罩和结果 */
        #mask { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 100; 
        }
        #paper { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 20px; z-index: 101; width: 85%; max-width: 350px;
        }
        .pet-img { width: 100%; border-radius: 15px; margin-bottom: 15px; }
        
        /* Loading 遮罩层 */
        #loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #f3f3f3;
            border-top: 5px solid #ffb6c1; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { margin-top: 15px; color: #ffb6c1; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">正在召唤猫猫中...</div>
    </div>

    <div id="app">
        <img src="logo.png" class="logo-img" alt="Logo">
        <p>心中默想一个问题，输入 1-412 之间的数字</p>
        
        <div class="input-group">
            <input type="number" id="userNum" placeholder="投喂小鱼干，猫猫回答" onkeydown="if(event.key==='Enter') revealAnswer()">
            <br>
            <button onclick="revealAnswer()">揭开答案</button>
        </div>
    </div>

    <div id="mask" onclick="closePaper()"></div>
    <div id="paper">
        <img id="petImg" src="" class="pet-img">
        <div id="answerText" style="text-align:center; font-weight:bold; color:#333;"></div>
        <button onclick="closePaper()" style="width:100%; margin-top:15px;">我知道了</button>
    </div>

    <script src="answers.js"></script>
    <script>
        // 1. 自动预加载前 20 张图
        window.addEventListener('load', function() {
            for (let i = 1; i <= 20; i++) {
                const img = new Image();
                img.src = `assets/${i}.PNG`; // 这里假设是小写png，如果是大写请手动改为 .PNG
            }
        });

        function revealAnswer() {
            const numInput = document.getElementById('userNum');
            const num = numInput.value;

            if (!num || num < 1 || num > 412) {
                alert("喵呜？请输入 1 到 412 之间的数字哦！");
                return;
            }

            // 显示加载动画
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';

            // 随机抽取 1-150 号图片
            const randomImgId = Math.floor(Math.random() * 150) + 1;
            const petImg = document.getElementById('petImg');
            
            // 使用 CDN 路径（请把 weo01 换成你的 GitHub 用户名，meow 换成仓库名）
            // 如果你不想用 CDN，就改回 'assets/' + randomImgId + '.png'
            const imgPath = `assets/${randomImgId}.png?t=${new Date().getTime()}`;

            // 监听图片加载
            petImg.onload = function() {
                overlay.style.display = 'none'; // 隐藏加载动画
                document.getElementById('mask').style.display = 'block';
                document.getElementById('paper').style.display = 'block';
                
                // 从 answers.js 获取文字（假设 answers 是个数组）
                if (typeof answers !== 'undefined') {
                    const randomIdx = Math.floor(Math.random() * answers.length);
                    document.getElementById('answerText').innerText = answers[randomIdx];
                }
            };

            // 如果图片加载失败的处理
            petImg.onerror = function() {
                overlay.style.display = 'none';
                alert("猫猫走丢了，请检查 assets 文件夹里是否有 " + randomImgId + ".png");
            };

            petImg.src = imgPath;
        }

        function closePaper() {
            document.getElementById('mask').style.display = 'none';
            document.getElementById('paper').style.display = 'none';
        }
    </script>
</body>
</html>
